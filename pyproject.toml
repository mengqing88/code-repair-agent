# 构建配置：指定由哪个工具将当前项目构建成可安装的 Python 包。
[build-system]
# requires：构建时需要的依赖；setuptools 64 起支持此处使用的可编辑安装流程。
requires = ["setuptools>=64"]
# build-backend：交由 setuptools 的标准构建后端处理打包和安装。
build-backend = "setuptools.build_meta"

# 项目元数据：描述包名称、版本、用途及运行依赖。
[project]
# name：安装工具识别的发行包名，不要求与 Python 模块名相同。
name = "code-repair-agent"
# version：当前项目版本号。
version = "0.1.0"
# description：安装工具展示的简短项目说明。
description = "Command-line input validation for Python code repair tasks."
# dependencies：运行依赖；openai 提供兼容接口客户端，python-dotenv 读取本地 .env 配置，
# psycopg 提供 PostgreSQL/pgvector 知识库连接。
# langgraph 提供 StateGraph；typing-extensions 提供兼容图状态解析的 TypedDict 类型声明。
# pydantic 用于校验模型返回的工具参数，并从同一模型生成 JSON Schema。
dependencies = [
    "openai>=2.0,<3.0",
    "psycopg[binary]>=3.1,<4.0",
    "python-dotenv>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "pydantic>=2.9,<3.0",
    "typing-extensions>=4.8,<5.0",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
]

# 可选依赖分组：安装时选择对应组，才会额外安装这些工具。
[project.optional-dependencies]
# dev：开发依赖组，通过 pip install -e ".[dev]" 安装 pytest。
dev = ["pytest", "httpx>=0.27,<1.0"]

# setuptools 的打包范围配置。
[tool.setuptools]
# py-modules：打包 CLI、模型调用、独立错误复现、修复状态、工作流和知识库模块，不收录测试模块。
py-modules = ["agent_cli", "llm_client", "reproduction", "defect_regression", "repair_state", "repair_workflow", "knowledge_base", "knowledge_cli", "repair_tools", "repair_api", "repair_worker", "resilience", "trace_store", "model_contracts", "operation_store", "diagnostics", "docker_executor", "recovery_store", "recovery_manager", "recovery_agent"]

# pytest 的项目级配置。
[tool.pytest.ini_options]
# testpaths：从项目根目录开始收集符合 pytest 命名规则的测试。
testpaths = ["."]
norecursedirs = ["work", ".venv", "frontend", "evaluation", ".git"]
